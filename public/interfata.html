<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfata</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Interfata web Sistem de Supraveghere </h1>
        <div class="video_container">
            <h2>Inregistrari Video: </h2>
            <div id="video_list">
                <script>
        async function loadRecordings() {
            try {
                const res = await fetch("/api/recordings");
                const files = await res.json();


                const grid = document.getElementById("video_list");

                if (files.length === 0) {
                    grid.innerHTML = `<p class="empty">No recordings yet.</p>`;
                    return;
                }

                grid.innerHTML = files.map(file => `
                    <div class="card">
                        <video controls preload="none">
                            <source src="/recordings/${file}" type="video/mp4">
                        </video>
                        <div class="card-info">
                            <p> Data si ora: ${file.replace("clip_", "").replace(".mp4", "").replace(".avi", "")}</p>
                            <a href="/recordings/${file}" download>⬇ Download</a>
                        </div>
                    </div>
                `).join("");

            } catch (err) {
                console.error("Error loading recordings:", err);
            }
        }

            loadRecordings();
    </script>
                
        </div>
        </div>
</html>
